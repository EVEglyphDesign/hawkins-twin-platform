name: Store credentials (age-encrypted)

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Encrypted payload from the credential intake page'
        required: true
        type: string

jobs:
  store:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age

      - name: Verify AGE_PUBLIC_KEY secret is set
        env:
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
        run: |
          if [ -z "$AGE_PUBLIC_KEY" ]; then
            echo "::error::AGE_PUBLIC_KEY secret is not set. Generate a key pair with 'age-keygen', set AGE_PUBLIC_KEY (recipient) and AGE_PRIVATE_KEY (identity) as repo secrets."
            exit 1
          fi
          echo "Recipient: $AGE_PUBLIC_KEY"

      - name: Extract inner payload
        env:
          BLOB: ${{ inputs.payload }}
        run: |
          # Strip the wireframe envelope, keep only the base64 body.
          echo "$BLOB" \
            | sed -n '/-----BEGIN WARRANTY-GENE-CREDENTIAL-PAYLOAD-----/,/-----END WARRANTY-GENE-CREDENTIAL-PAYLOAD-----/p' \
            | sed '/-----BEGIN/d;/-----END/d;/^note:/d;/^$/d' \
            | tr -d '\n' \
            > payload.b64

          if [ ! -s payload.b64 ]; then
            echo "::error::Payload envelope not found or empty."
            exit 1
          fi

          base64 -d payload.b64 > payload.json
          echo "Payload extracted ($(wc -c < payload.json) bytes)."

          # Validate it is JSON with expected shape. Any section may be blank
          # (partial capture is allowed); at least one section must have
          # username + password + url filled in.
          python3 <<'PY'
          import json
          d = json.load(open('payload.json'))
          schema = d.get('schema','')
          assert schema in ('warranty-gene/credentials/v1',
                            'warranty-gene/credentials/v2'), f'schema {schema} not recognised'
          sections = [k for k in ('cdk','brp','lightspeed') if k in d]
          filled = [
              k for k in sections
              if d[k].get('url') and d[k].get('username') and d[k].get('password')
          ]
          assert filled, 'no section has url+username+password filled in'
          print(f'Payload OK. Filled sections: {filled}')
          PY

      - name: Encrypt with age
        env:
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
        run: |
          age -r "$AGE_PUBLIC_KEY" -o warranty-gene/dms-pull/credentials.age payload.json
          echo "Encrypted file: $(wc -c < warranty-gene/dms-pull/credentials.age) bytes"

      - name: Wipe plaintext
        if: always()
        run: |
          shred -u payload.json payload.b64 2>/dev/null || rm -f payload.json payload.b64

      - name: Commit
        run: |
          git config user.name "EVEglyphDesign (credential intake)"
          git config user.email "bot@eveglyphdesign.com"
          git add warranty-gene/dms-pull/credentials.age
          git commit -m "Warranty GENE: store encrypted DMS credentials ($(date -u +%FT%TZ))"
          git push
